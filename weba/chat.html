<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ስለ እኛ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            background-color: aliceblue;
        }
        img {
            float: right;
            margin-top: 100px;
            width: 450px;
            margin-right: 100px;
            margin-bottom: 300px;
            height: 400px;
        }
        button {
            border: 2px solid;
            width: 90px;
            height: 50px;
            border-radius: 10px;
            font-size: 16px;
        }
        #box1 {
            display: inline-block;
            margin-left: 400px;
            font-size: 30px;
        }
        #img1 {
            margin-left: 50px;
            width: 1000px;
        }
        .fa-facebook, .fa-linkedin-in, .fa-twitter, .fa-telegram {
            font-size: 23px;
            color: rgb(191, 186, 186);
            margin-left: 20px;
        }
    </style>
</head>
<body>

    <h1 style="margin-top: 250px; margin-left: 150px; color: rgb(32, 78, 32);">ስለ እኛ</h1>
    <p style="margin-left: 200px; font-size: 15px; color: rgb(55, 54, 54);">
        የወባ ስርጭትን በራስ ሰር እና ቀልጣፋ በመታገል...
    </p>

    <a href="5.html"><button style="background-color: rgb(30, 65, 30); color: white;">አግኙን</button></a>

    <br><br>

    <div style="border:2px solid; background-color: rgb(24, 89, 65); width: 1200px; height: 400px; border-radius: 20px; margin-left: 150px;">
        <p style="padding-top: 100px; text-align: center; color: white; font-size: 30px;">እራሰወን ከወባ ትንኝ ይከላከሉ</p>
        <p style="text-align: center; color: rgb(181, 162, 162);">ዛሬውኑ አውቶማቲክ...</p>
        <a href="5.html"><button style="margin-left: 550px; border-radius: 10px;">ይዘዙ</button></a>
    </div>

    <h1 style="text-align: center; color: darkgreen; margin-top: 100px;">ምርታችንን ይዘዙ</h1>
    <p style="font-size: 15px; margin-left: 400px; color: rgb(60, 58, 58);">የእቃው ምስል</p>
    
    <div style="border: 5px solid; height: 50px; width: 1000px;">
        <img id="img1" src="Group 1000003405.png" alt="Product Image">
    </div>

    <form action="index.html" method="post">
        <div id="box1">
            <label for="item-id">የእቃው መለያ</label><br>      
            <input type="text" id="item-id" value="#On12345"><br><br>

            <label for="quantity">የትእዛዝ ብዛት</label><br>
            <input type="number" id="quantity"><br><br>

            <label for="price">የእያንዳንዱ ዋጋ</label><br>              
            <input type="text" id="price" value="250ETB"><br><br>

            <label for="city">ከተማ *</label><br>
            <input type="text" id="city" placeholder="ኣሳያ"><br><br>

            <label for="phone">ስልክ ቁጥር *</label><br>
            <input type="text" id="phone" placeholder="09********45"><br><br> 
        </div>

        <p style="margin-left: 400px;">     
            <label for="total">ጠቅላላ ዋጋ</label><br>
            <input type="text" id="total" placeholder="0.0" style="min-height: 30px; width: 750px;">
        </p>

        <button type="reset">ይመለሱ</button>
        <button type="submit" style="background-color: darkgreen; color: white;">ይዘዙ</button>
    </form>

    <footer style="background-color: rgb(9, 47, 9); padding: 20px; text-align: center;">
        <img src="logo2-removebg-preview 5.png" alt="Logo">
        <p style="color: rgb(190, 185, 185);">ያለስጋት ይኑሩ!</p>

        <i class="fa-brands fa-facebook"></i>
        <i class="fa-brands fa-linkedin-in"></i>
        <i class="fa-brands fa-twitter"></i>
        <i class="fa-brands fa-telegram"></i>

        <ul style="color: white;">
            <li>አግኙን</li>
            <li>ስለ እኛ</li>
            <li>ምርታችን</li>
            <li>መግቢያ</li>
        </ul>
    </footer>

</body>
</html>
